<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArtifyGH Editor</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --brand:#7c3aed;
  --pink:#ec4899;
  --dark:#171321;
  --muted:#756d80;
  --line:#e7e1ec;
  --workspace:#f2eff5;
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--workspace);
  color:var(--dark);
  height:100vh;
  overflow:hidden;
}

button,
input,
select,
textarea{
  font:inherit;
}

.topbar{
  height:64px;
  background:#fff;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  gap:18px;
  padding:0 18px;
  position:relative;
  z-index:100;
}

.logo{
  font-size:1.35rem;
  font-weight:900;
  letter-spacing:-.05em;
  text-decoration:none;
  color:var(--dark);
}

.logo span{
  color:var(--brand);
}

.editor-name{
  font-weight:800;
  color:#5d5665;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:260px;
}

.top-spacer{
  flex:1;
}

.top-btn{
  border:1px solid var(--line);
  background:#fff;
  border-radius:9px;
  padding:8px 13px;
  font-weight:750;
  cursor:pointer;
}

.top-btn:hover{
  border-color:var(--brand);
}

.top-btn.primary{
  background:linear-gradient(135deg,var(--brand),var(--pink));
  border:0;
  color:#fff;
}

.editor{
  height:calc(100vh - 64px);
  display:grid;
  grid-template-columns:240px 1fr 290px;
}

.panel{
  background:#fff;
  overflow:auto;
}

.left{
  border-right:1px solid var(--line);
  padding:16px;
}

.right{
  border-left:1px solid var(--line);
  padding:16px;
}

.section-title{
  font-size:.72rem;
  text-transform:uppercase;
  letter-spacing:.12em;
  font-weight:900;
  color:#817889;
  margin:8px 0 12px;
}

.tools{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.tool{
  border:1px solid var(--line);
  background:#fff;
  border-radius:11px;
  padding:13px 8px;
  cursor:pointer;
  font-weight:800;
  color:#413b49;
}

.tool:hover{
  border-color:var(--brand);
  color:var(--brand);
  transform:translateY(-1px);
}

.tool b{
  display:block;
  font-size:1.2rem;
  margin-bottom:4px;
}

.upload{
  display:block;
  border:2px dashed #d8cfe1;
  border-radius:12px;
  padding:15px;
  text-align:center;
  margin:16px 0;
  color:var(--muted);
  cursor:pointer;
  font-size:.82rem;
}

.upload strong{
  display:block;
  color:var(--dark);
  margin-bottom:4px;
}

#upload{
  display:none;
}

.layers{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.layer{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#faf9fb;
  cursor:pointer;
  font-size:.8rem;
  font-weight:700;
}

.layer.active{
  border-color:var(--brand);
  background:#f4efff;
  color:var(--brand);
}

.layer-name{
  flex:1;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.layer-actions{
  display:flex;
  gap:2px;
}

.layer-actions button{
  border:0;
  background:transparent;
  cursor:pointer;
  padding:2px;
}

.workspace{
  position:relative;
  overflow:auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:28px;
}

.workspace-tools{
  display:flex;
  align-items:center;
  gap:7px;
  margin-bottom:12px;
  background:#fff;
  border:1px solid var(--line);
  padding:6px;
  border-radius:10px;
  box-shadow:0 5px 18px rgba(30,20,50,.06);
}

.mini{
  border:0;
  background:#fff;
  border-radius:7px;
  padding:6px 9px;
  cursor:pointer;
  font-weight:750;
}

.mini:hover{
  background:#f3eef8;
}

.zoom{
  font-size:.78rem;
  color:var(--muted);
  font-weight:750;
  padding:0 8px;
}

.canvas-wrap{
  position:relative;
  filter:drop-shadow(0 22px 40px rgba(30,20,50,.18));
}

.canvas{
  position:relative;
  width:540px;
  height:675px;
  background:#fff;
  overflow:hidden;
  transform-origin:center center;
}

.canvas-grid{
  position:absolute;
  inset:0;
  background-image:
    linear-gradient(#ffffff12 1px,transparent 1px),
    linear-gradient(90deg,#ffffff12 1px,transparent 1px);
  background-size:30px 30px;
  pointer-events:none;
  z-index:0;
}

.el{
  position:absolute;
  user-select:none;
  cursor:move;
  transform-origin:center center;
}

.el.selected{
  outline:2px solid var(--brand);
  outline-offset:2px;
}

.el.text{
  white-space:pre-wrap;
  overflow:hidden;
}

.el img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  pointer-events:none;
}

.el.shape{
  background:#ddd;
}

.handle{
  position:absolute;
  width:9px;
  height:9px;
  background:#fff;
  border:2px solid var(--brand);
  border-radius:2px;
  display:none;
  z-index:20;
}

.selected .handle{
  display:block;
}

.h-nw{
  left:-6px;
  top:-6px;
  cursor:nwse-resize;
}

.h-ne{
  right:-6px;
  top:-6px;
  cursor:nesw-resize;
}

.h-sw{
  left:-6px;
  bottom:-6px;
  cursor:nesw-resize;
}

.h-se{
  right:-6px;
  bottom:-6px;
  cursor:nwse-resize;
}

.rotate{
  position:absolute;
  left:50%;
  top:-30px;
  width:18px;
  height:18px;
  border-radius:50%;
  background:var(--brand);
  transform:translateX(-50%);
  display:none;
  cursor:grab;
}

.rotate:after{
  content:"";
  position:absolute;
  left:8px;
  top:18px;
  width:2px;
  height:12px;
  background:var(--brand);
}

.selected .rotate{
  display:block;
}

.props-empty{
  color:var(--muted);
  font-size:.85rem;
  line-height:1.6;
  padding:10px 2px;
}

.field{
  margin-bottom:15px;
}

.field label{
  display:block;
  font-size:.76rem;
  font-weight:800;
  color:#625b6b;
  margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:8px;
  padding:9px;
  outline:none;
  background:#fff;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--brand);
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.color-row{
  display:flex;
  gap:8px;
  align-items:center;
}

.color-row input[type=color]{
  width:44px;
  height:38px;
  border:0;
  padding:0;
}

.danger{
  width:100%;
  border:1px solid #fecaca;
  background:#fff5f5;
  color:#b91c1c;
  padding:10px;
  border-radius:8px;
  font-weight:800;
  cursor:pointer;
}

.muted-note{
  font-size:.72rem;
  color:var(--muted);
  line-height:1.5;
}

@media(max-width:1050px){

  .editor{
    grid-template-columns:210px 1fr 250px;
  }

  .canvas{
    width:460px;
    height:575px;
  }

}

@media(max-width:820px){

  body{
    overflow:auto;
    height:auto;
  }

  .topbar{
    position:sticky;
    top:0;
  }

  .editor{
    height:auto;
    min-height:calc(100vh - 64px);
    grid-template-columns:1fr;
  }

  .left,
  .right{
    border:0;
    border-bottom:1px solid var(--line);
  }

  .workspace{
    order:2;
    min-height:720px;
  }

  .right{
    order:3;
  }

  .left{
    order:1;
  }

  .canvas{
    width:min(88vw,430px);
    height:calc(min(88vw,430px)*1.25);
  }

  .tools{
    grid-template-columns:repeat(4,1fr);
  }

  .tool{
    padding:9px 3px;
    font-size:.72rem;
  }

  .tool b{
    font-size:1rem;
  }

}
</style>
</head>

<body>

<header class="topbar">

<a href="index.html" class="logo">
Artify<span>GH</span>
</a>

<div class="editor-name" id="editorName">
Design Editor
</div>

<div class="top-spacer"></div>

<button class="top-btn" onclick="undo()">
↶ Undo
</button>

<button class="top-btn" onclick="redo()">
↷ Redo
</button>

<button class="top-btn" onclick="exitEditor()">
Exit
</button>

<button class="top-btn primary" onclick="saveDesign()">
Save Design
</button>

</header>


<main class="editor">


<!-- LEFT PANEL -->

<aside class="panel left">

<div class="section-title">
Add elements
</div>

<div class="tools">

<button class="tool" onclick="addText()">
<b>T</b>
Text
</button>

<button class="tool" onclick="addImage()">
<b>▧</b>
Image
</button>

<button class="tool" onclick="triggerUpload()">
<b>↥</b>
Upload
</button>

<button class="tool" onclick="addShape()">
<b>□</b>
Shape
</button>

</div>


<label class="upload">

<strong>
Upload photo or logo
</strong>

Choose an image from your phone or computer

<input
id="upload"
type="file"
accept="image/*"
onchange="handleUpload(event)"
>

</label>


<div class="section-title">
Layers
</div>

<div id="layers" class="layers">
</div>

</aside>


<!-- WORKSPACE -->

<section class="workspace">

<div class="workspace-tools">

<button class="mini" onclick="zoom(-10)">
−
</button>

<span id="zoomLabel" class="zoom">
100%
</span>

<button class="mini" onclick="zoom(10)">
+
</button>

<button class="mini" onclick="fitCanvas()">
Fit
</button>

<button class="mini" onclick="bringForward()">
↑
</button>

<button class="mini" onclick="sendBackward()">
↓
</button>

</div>


<div class="canvas-wrap">

<div id="canvas" class="canvas">

<div class="canvas-grid"></div>

</div>

</div>

</section>


<!-- RIGHT PANEL -->

<aside class="panel right">

<div class="section-title">
Properties
</div>

<div
id="properties"
class="props-empty"
>
Select an element on the design to edit its text, size, colour, position or rotation.
</div>

</aside>

</main>


<input
id="hiddenUpload"
type="file"
accept="image/*"
style="display:none"
>


<script>

const params =
new URLSearchParams(location.search);

const templateName =
params.get("template") ||
"ArtifyGH Design";

document.getElementById("editorName").textContent =
templateName;

document.title =
templateName +
" — ArtifyGH Editor";


let state = {

  width:1080,

  height:1350,

  zoom:50,

  elements:[],

  selected:null

};


let history = [];

let future = [];

let drag = null;

let resize = null;

let rotateDrag = null;


/* STARTER TEMPLATE */

const starter = [

{

id:"eyebrow",

type:"text",

text:"YOU'RE INVITED",

x:180,

y:250,

w:720,

h:55,

fontSize:28,

color:"#8b5cf6",

fontFamily:"Arial",

fontWeight:"800",

align:"center",

rotation:0,

editable:true

},

{

id:"title",

type:"text",

text:"Forever Begins",

x:120,

y:390,

w:840,

h:150,

fontSize:76,

color:"#171321",

fontFamily:"Georgia",

fontWeight:"700",

align:"center",

rotation:0,

editable:true

},

{

id:"details",

type:"text",

text:
"Kwame & Ama\n14 November 2026\n4:00 PM · Accra",

x:170,

y:650,

w:740,

h:220,

fontSize:30,

color:"#6f6877",

fontFamily:"Arial",

fontWeight:"500",

align:"center",

rotation:0,

editable:true

},

{

id:"shape",

type:"shape",

shape:"circle",

x:35,

y:35,

w:210,

h:210,

color:"#f1e5ff",

border:"#d8b4fe",

borderWidth:4,

rotation:0,

editable:true

}

];


/* HISTORY */

function snapshot(){

return JSON.stringify(
state.elements
);

}


function commit(){

history.push(
snapshot()
);

if(history.length > 40){

history.shift();

}

future=[];

}


/* UNDO */

function undo(){

if(!history.length)
return;

future.push(
snapshot()
);

state.elements =
JSON.parse(
history.pop()
);

state.selected=null;

render();

}


/* REDO */

function redo(){

if(!future.length)
return;

history.push(
snapshot()
);

state.elements =
JSON.parse(
future.pop()
);

state.selected=null;

render();

}


/* FIND ELEMENT */

function el(id){

return state.elements.find(
x=>x.id===id
);

}


function selected(){

return el(
state.selected
);

}


function newId(prefix){

return prefix +
"-" +
Date.now() +
"-" +
Math.random()
.toString(36)
.slice(2,6);

}


/* RENDER */

function render(){

const canvas =
document.getElementById(
"canvas"
);

canvas.innerHTML =
'<div class="canvas-grid"></div>';

canvas.style.width =
(state.width *
state.zoom / 100) +
"px";

canvas.style.height =
(state.height *
state.zoom / 100) +
"px";


state.elements.forEach(
(e,i)=>
renderElement(e,i)
);


renderLayers();

renderProperties();

document.getElementById(
"zoomLabel"
).textContent =
Math.round(state.zoom) +
"%";

}


/* RENDER ELEMENT */

function renderElement(e,i){

const canvas =
document.getElementById(
"canvas"
);

const d =
document.createElement(
"div"
);

d.className =
"el " +
e.type +
(e.id === state.selected
? " selected"
: "");

d.dataset.id =
e.id;

d.style.left =
(e.x *
state.zoom /
100) +
"px";

d.style.top =
(e.y *
state.zoom /
100) +
"px";

d.style.width =
(e.w *
state.zoom /
100) +
"px";

d.style.height =
(e.h *
state.zoom /
100) +
"px";

d.style.zIndex =
i + 1;

d.style.transform =
"rotate(" +
(e.rotation || 0) +
"deg)";


if(e.type === "text"){

d.textContent =
e.text;

d.style.fontSize =
(e.fontSize *
state.zoom /
100) +
"px";

d.style.color =
e.color;

d.style.fontFamily =
e.fontFamily;

d.style.fontWeight =
e.fontWeight;

d.style.textAlign =
e.align;

d.style.lineHeight =
e.lineHeight ||
1.2;

d.style.padding =
"2px 4px";

d.ondblclick =
() =>
editTextInline(e.id);

}


if(e.type === "image"){

const img =
document.createElement(
"img"
);

img.src =
e.src;

img.alt =
e.name ||
"ArtifyGH image";

d.appendChild(img);

}


if(e.type === "shape"){

d.style.background =
e.color ||
"#ddd";

d.style.border =
(e.borderWidth || 0) +
"px solid " +
(e.border ||
"transparent");

d.style.borderRadius =
e.shape === "circle"
? "50%"
: (e.radius || "12px");

}


/* RESIZE HANDLES */

["nw","ne","sw","se"]
.forEach(
h=>{

const b =
document.createElement(
"span"
);

b.className =
"handle h-" +
h;

b.onmousedown =
x =>
startResize(
x,
e.id,
h
);

d.appendChild(b);

});


/* ROTATION */

const r =
document.createElement(
"span"
);

r.className =
"rotate";

r.onmousedown =
x =>
startRotate(
x,
e.id
);

d.appendChild(r);


/* DRAG */

d.onmousedown =
x =>
startDrag(
x,
e.id
);


/* SELECT */

d.onclick =
x => {

x.stopPropagation();

select(e.id);

};


canvas.appendChild(d);

}


/* SELECT */

function select(id){

state.selected =
id;

render();

}


document.getElementById(
"canvas"
).onclick =
()=>{

state.selected =
null;

render();

};


/* DRAG */

function startDrag(
ev,
id
){

if(
ev.target.classList.contains(
"handle"
) ||
ev.target.classList.contains(
"rotate"
)
)
return;

ev.stopPropagation();

select(id);

commit();

const e =
el(id);

drag={

id,

startX:ev.clientX,

startY:ev.clientY,

x:e.x,

y:e.y

};

document.onmousemove =
moveDrag;

document.onmouseup =
endPointer;

}


function moveDrag(ev){

if(!drag)
return;

const e =
el(drag.id);

const s =
state.zoom / 100;

e.x =
drag.x +
(ev.clientX -
drag.startX) /
s;

e.y =
drag.y +
(ev.clientY -
drag.startY) /
s;

render();

}


/* RESIZE */

function startResize(
ev,
id,
handle
){

ev.stopPropagation();

select(id);

commit();

const e =
el(id);

resize={

id,

handle,

startX:ev.clientX,

startY:ev.clientY,

x:e.x,

y:e.y,

w:e.w,

h:e.h

};

document.onmousemove =
moveResize;

document.onmouseup =
endPointer;

}


function moveResize(ev){

if(!resize)
return;

const e =
el(resize.id);

const s =
state.zoom / 100;

const dx =
(ev.clientX -
resize.startX) /
s;

const dy =
(ev.clientY -
resize.startY) /
s;

let x =
resize.x;

let y =
resize.y;

let w =
resize.w;

let h =
resize.h;


if(
resize.handle.includes("e")
){

w =
Math.max(
30,
resize.w + dx
);

}


if(
resize.handle.includes("s")
){

h =
Math.max(
30,
resize.h + dy
);

}


if(
resize.handle.includes("w")
){

w =
Math.max(
30,
resize.w - dx
);

x =
resize.x + dx;

}


if(
resize.handle.includes("n")
){

h =
Math.max(
30,
resize.h - dy
);

y =
resize.y + dy;

}


Object.assign(
e,
{x,y,w,h}
);

render();

}


/* ROTATE */

function startRotate(
ev,
id
){

ev.stopPropagation();

select(id);

commit();

const e =
el(id);

const rect =
document
.getElementById("canvas")
.getBoundingClientRect();

rotateDrag={

id,

cx:
rect.left +
(e.x + e.w / 2) *
state.zoom /
100,

cy:
rect.top +
(e.y + e.h / 2) *
state.zoom /
100

};

document.onmousemove =
moveRotate;

document.onmouseup =
endPointer;

}


function moveRotate(ev){

if(!rotateDrag)
return;

const e =
el(
rotateDrag.id
);

e.rotation =
Math.round(
Math.atan2(
ev.clientY -
rotateDrag.cy,

ev.clientX -
rotateDrag.cx
) *
180 /
Math.PI +
90
);

render();

}


/* END POINTER */

function endPointer(){

drag =
resize =
rotateDrag =
null;

document.onmousemove =
null;

document.onmouseup =
null;

}


/* LAYERS */

function renderLayers(){

const box =
document.getElementById(
"layers"
);

box.innerHTML="";


[
...state.elements
]
.reverse()
.forEach(
e=>{

const row =
document.createElement(
"div"
);

row.className =
"layer " +
(e.id === state.selected
? "active"
: "");

row.onclick =
() =>
select(e.id);


const name =
document.createElement(
"span"
);

name.className =
"layer-name";

name.textContent =
e.type === "text"
? (e.text || "Text")
: e.type === "image"
? (e.name || "Image")
: "Shape";


row.appendChild(name);


const actions =
document.createElement(
"span"
);

actions.className =
"layer-actions";


const up =
document.createElement(
"button"
);

up.textContent="↑";

up.onclick =
x=>{

x.stopPropagation();

moveLayer(
e.id,
1
);

};


const down =
document.createElement(
"button"
);

down.textContent="↓";

down.onclick =
x=>{

x.stopPropagation();

moveLayer(
e.id,
-1
);

};


actions.append(
up,
down
);

row.appendChild(
actions
);

box.appendChild(
row
);

});

}


/* MOVE LAYER */

function moveLayer(
id,
dir
){

commit();

const i =
state.elements.findIndex(
e =>
e.id === id
);

const j =
i + dir;

if(
j < 0 ||
j >= state.elements.length
)
return;

[
state.elements[i],
state.elements[j]
] =
[
state.elements[j],
state.elements[i]
];

render();

}


/* PROPERTIES */

function renderProperties(){

const box =
document.getElementById(
"properties"
);

const e =
selected();


if(!e){

box.className =
"props-empty";

/* UPDATE PROPERTY */

function updateProperty(
id,
v
){

const e =
selected();

if(!e)
return;

commit();


const map={

pText:"text",

pFont:"fontFamily",

pSize:"fontSize",

pWeight:"fontWeight",

pColor:"color",

pAlign:"align",

pBorder:"border",

pX:"x",

pY:"y",

pW:"w",

pH:"h",

pRotation:"rotation"

};


const key =
map[id];

if(!key)
return;


e[key] =
(
key === "text" ||
key === "fontFamily" ||
key === "fontWeight" ||
key === "color" ||
key === "align" ||
key === "border"
)
? v
: Number(v);


render();

}


/* DOUBLE CLICK TEXT */

function editTextInline(id){

const e =
el(id);

const value =
prompt(
"Edit text",
e.text
);

if(
value !== null
){

commit();

e.text =
value;

render();

}

}


/* ADD TEXT */

function addText(){

commit();

const e={

id:newId("text"),

type:"text",

text:"Your text",

x:180,

y:900,

w:720,

h:100,

fontSize:52,

color:"#171321",

fontFamily:"Arial",

fontWeight:"700",

align:"center",

rotation:0,

};

e.id;

}


/* ADD SHAPE */

function addShape(){

commit();

const e={

id:newId("shape"),

type:"shape",

shape:"circle",

x:80,

w:180,

color:"#eadcff",

};

state.elements.push(e);

state.selected =

/* IMAGE */

function addImage(){

triggerUpload();

}


function triggerUpload(){

document
.getElementById(
"hiddenUpload"
)
.click();

}


document.getElementById(
"hiddenUpload"
).onchange =
handleUpload;


/* UPLOAD */

function handleUpload(ev){

const file =
ev.target.files[0];

if(!file)
return;


const reader =
new FileReader();


reader.onload =
()=>{

commit();


const e={

id:newId("image"),

type:"image",

name:file.name,

src:reader.result,

x:190,

y:360,

w:700,

h:430,

rotation:0,

editable:true

};


state.elements.push(e);

state.selected =
e.id;

render();

ev.target.value="";

};


reader.readAsDataURL(
file
);

}


/* DELETE */

function deleteSelected(){

if(!state.selected)
return;

commit();

state.elements =
state.elements.filter(
e =>
e.id !==
state.selected
);

state.selected=null;

render();

}


/* LAYERS */

function bringForward(){

if(!state.selected)
return;

moveLayer(
state.selected,
1
);

}


function sendBackward(){

if(!state.selected)
return;

moveLayer(
state.selected,
-1
);

}


/* ZOOM */

function zoom(n){

state.zoom =
Math.max(
25,
Math.min(
100,
state.zoom + n
)
);

render();

}


/* FIT */

function fitCanvas(){

const area =
document.querySelector(
".workspace"
);

const maxW =
Math.max(
250,
area.clientWidth - 80
);

const maxH =
Math.max(
350,
area.clientHeight - 110
);


state.zoom =
Math.min(
100,

maxW /
state.width *
100,

maxH /
state.height *
100
);

render();

}


/* ESCAPE HTML */

function esc(s){

return String(
s || ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
);

}


/* SAVE */

function saveDesign(){

localStorage.setItem(

"artifygh-design-" +
templateName,

JSON.stringify({

template:
templateName,

state:
state

})

);


alert(
"Design saved on this device. Cloud accounts, payments and final download will be connected in the next stage."
);

}

location.href =
"index.html#templates";

}


/* LOAD SAVED DESIGN */

const saved =
localStorage.getItem(
"artifygh-design-" +
templateName
);


if(saved){

try{

state =
JSON.parse(saved).state;

}

catch(e){}

}


if(
!state.elements.length
){

state.elements =
starter.map(
x =>
({...x})
);

}


render();


setTimeout(
fitCanvas,
100
);
